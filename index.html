<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>The Long Silence</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/touch-controls.css" />
<!--
  Zero-build client. three.js 0.186.0 is vendored as a static file (not
  pulled from a CDN) under js/vendor/three, so this works offline and on
  GitHub Pages without a build step.
-->
<script type="importmap">
{
 "imports": {
  "three": "./js/vendor/three/three.module.js"
 }
}
</script>
</head>
<body>
 <div id="scene-container"></div>

 <div id="dialogue-panel" hidden>
  <p id="dialogue-speaker"></p>
  <p id="dialogue-line"></p>
  <ul id="dialogue-choices"></ul>
 </div>

 <div id="interact-prompt" class="prompt" hidden></div>
 <div id="action-prompt" class="prompt" hidden></div>

 <div id="speech-bubble" hidden>&hellip;</div>

 <div id="flight-hud" hidden>
  <p id="flight-readout"></p>
  <p id="flight-hint">W/S throttle &middot; Arrow keys steer &middot; F to release the helm</p>
 </div>

 <div id="hint">WASD or arrow keys to move. Press E near a crew member to talk, F to interact with objects.</div>

 <script type="module" src="js/main.js"></script>
 <script type="module" src="js/touch-controls.js"></script>
</body>
</html>
